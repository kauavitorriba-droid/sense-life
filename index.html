<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Organizador de Aulas e Dicionário</title>
  <style>
    /* ESTILOS GERAIS DA PÁGINA */
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f9;
      margin: 0;
      padding: 20px;
      color: #333;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    .secao {
      background: white;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 25px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    /* GRADE DO CALENDÁRIO */
    .grid-dias {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
      gap: 10px;
      margin-top: 15px;
    }

    .dia-card {
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 10px;
      min-height: 90px;
      background: #fafafa;
      cursor: pointer;
      transition: background 0.2s;
    }

    .dia-card:hover {
      background: #eef5ff;
    }

    .dia-titulo {
      font-weight: bold;
      color: #007bff;
      margin-bottom: 5px;
    }

    .aula-resumo {
      font-size: 0.85em;
      color: #555;
      word-wrap: break-word;
    }

    /* FORMULÁRIO DO DICIONÁRIO */
    .form-dicionario {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
      flex-wrap: wrap;
    }

    input[type="text"], textarea {
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      width: 100%;
      box-sizing: border-box;
    }

    .form-dicionario input {
      flex: 1;
      min-width: 150px;
    }

    button {
      background: #28a745;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 4px;
      cursor: pointer;
    }

    button:hover {
      background: #218838;
    }

    /* LISTA DO DICIONÁRIO */
    .item-dicionario {
      border-left: 4px solid #17a2b8;
      background: #f8f9fa;
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 0 4px 4px 0;
    }

    /* MODAL (JANELA FLUTUANTE) DA AULA */
    .modal-fundo {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
    }

    .modal-conteudo {
      background: white;
      padding: 20px;
      border-radius: 8px;
      width: 400px;
      max-width: 90%;
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- 1. SEÇÃO DO CALENDÁRIO / AULAS -->
    <div class="secao">
      <h2>📅 Calendário de Aulas e Tarefas</h2>
      <p>Clique em um dia para abrir e adicionar detalhes do que aprendeu.</p>
      
      <div class="grid-dias" id="gridCalendario">
        <!-- Os dias serão inseridos via JavaScript -->
      </div>
    </div>

    <!-- 2. SEÇÃO DO DICIONÁRIO -->
    <div class="secao">
      <h2>📖 Meu Dicionário de Conceitos</h2>
      <div class="form-dicionario">
        <input type="text" id="termoInput" placeholder="Palavra / Termo (ex: Fotossíntese)">
        <input type="text" id="defInput" placeholder="Definição ou significado">
        <button onclick="adicionarTermo()">Adicionar</button>
      </div>
      <div id="listaDicionario">
        <!-- Termos salvos aparecem aqui -->
      </div>
    </div>

  </div>

  <!-- JANELA POP-UP PARA EDITAR DETALHES DO DIA SELECIONADO -->
  <div class="modal-fundo" id="modalAula">
    <div class="modal-conteudo">
      <h3 id="modalTitulo">Editar Dia</h3>
      <label><strong>Descrição da Aula / O que aprendi:</strong></label><br><br>
      <textarea id="textoAnotacao" rows="6" placeholder="Escreva as anotações da aula ou tarefas aqui..."></textarea><br><br>
      <button onclick="salvarAnotacao()">Salvar</button>
      <button style="background: #dc3545;" onclick="fecharModal()">Cancelar</button>
    </div>
  </div>

  <script>
    // Lista com os dias da semana para o calendário
    const diasSemana = ["Segunda", "Terça", "Quarta", "Quinta", "Sexta", "Sábado", "Domingo"];
    
    // Objeto que armazena os blocos de texto/anotações de cada dia
    let dadosAulas = {
      "Segunda": "",
      "Terça": "",
      "Quarta": "",
      "Quinta": "",
      "Sexta": "",
      "Sábado": "",
      "Domingo": ""
    };

    let diaSelecionado = "";

    // Função que desenha os cartões do calendário na tela
    function renderizarCalendario() {
      const container = document.getElementById("gridCalendario");
      container.innerHTML = ""; // Limpa o conteúdo atual

      diasSemana.forEach(dia => {
        const card = document.createElement("div");
        card.className = "dia-card";
        card.onclick = () => abrirModal(dia);

        // Pega os primeiros 25 caracteres para exibir uma prévia no cartão
        const textoExistente = dadosAulas[dia];
        const resumo = textoExistente ? textoExistente.substring(0, 25) + "..." : "<i>Clique para editar</i>";

        card.innerHTML = `
          <div class="dia-titulo">${dia}</div>
          <div class="aula-resumo">${resumo}</div>
        `;

        container.appendChild(card);
      });
    }

    // Abre a janela flutuante e carrega o texto salvo do dia selecionado
    function abrirModal(dia) {
      diaSelecionado = dia;
      document.getElementById("modalTitulo").innerText = "Aula / Tarefas: " + dia;
      document.getElementById("textoAnotacao").value = dadosAulas[dia] || "";
      document.getElementById("modalAula").style.display = "flex";
    }

    // Fecha a janela flutuante
    function fecharModal() {
      document.getElementById("modalAula").style.display = "none";
    }

    // Salva o texto digitado no objeto e atualiza a tela
    function salvarAnotacao() {
      const conteudo = document.getElementById("textoAnotacao").value;
      dadosAulas[diaSelecionado] = conteudo;
      fecharModal();
      renderizarCalendario();
    }

    // Adiciona uma nova palavra e definição na lista do dicionário
    function adicionarTermo() {
      const termo = document.getElementById("termoInput").value.trim();
      const definicao = document.getElementById("defInput").value.trim();

      if (!termo || !definicao) {
        alert("Preencha o termo e a definição!");
        return;
      }

      const lista = document.getElementById("listaDicionario");
      const item = document.createElement("div");
      item.className = "item-dicionario";
      item.innerHTML = `<strong>${termo}:</strong> ${definicao}`;

      lista.appendChild(item);

      // Reseta os campos após adicionar
      document.getElementById("termoInput").value = "";
      document.getElementById("defInput").value = "";
    }

    // Inicializa a exibição do calendário assim que o script carrega
    renderizarCalendario();
  </script>

</body>
</html>
